[toolchain]
anchor_version = "1.0.2"
package_manager = "yarn"

[features]
resolution = true
skip-lint = false

[programs.localnet]
opportunity_market = "bncqApu6NkUibDwnbfXR5oRPCLiYjwHgVuCdHRTD6rp"

[provider]
cluster = "http://127.0.0.1:8899"
wallet = "~/.config/solana/id.json"

[scripts]
test = "bun run ts-mocha -p ./tsconfig.json -t 1000000 --slow 120000 \"tests/**/*.test.ts\""
js-generate = "anchor build --ignore-keys && cp target/idl/opportunity_market.json js/src/idl/opportunity_market.json && bun i && cd js && bun generate"
fmt = "cargo fmt --all && cargo clippy --workspace --all-targets --fix --allow-dirty --allow-staged -- -D warnings"

[test]
startup_wait = 9000000
shutdown_wait = 2000
upgradeable = false

[test.validator]
bind_address = "127.0.0.1"
ledger = ".anchor/test-ledger"
rpc_port = 8899
